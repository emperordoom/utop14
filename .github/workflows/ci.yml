name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: utop14_ci
          POSTGRES_PASSWORD: utop14_ci_test_only
          POSTGRES_DB: utop14_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utop14_ci -d utop14_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      APP_ENV: testing
      SECRET_KEY: ci-only-not-a-production-secret
      TEST_SECRET_KEY: ci-only-test-secret
      DATABASE_URL: postgresql+psycopg://utop14_ci:utop14_ci_test_only@127.0.0.1:5432/utop14_test
      TEST_DATABASE_URL: postgresql+psycopg://utop14_ci:utop14_ci_test_only@127.0.0.1:5432/utop14_test
      TRUSTED_PROXY_HOPS: "0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify isolated CI database
        run: |
          python - <<'PY'
          import os

          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          def database_name(variable: str) -> str:
              url = os.environ[variable]
              name = make_url(url).database or ""
              if not name.endswith("_test"):
                  raise SystemExit(
                      f"Refusing CI: {variable} database {name!r} does not end with '_test'."
                  )
              if name == "utop14_db":
                  raise SystemExit(
                      f"Refusing CI: {variable} points at utop14_db."
                  )
              return name

          test_name = database_name("TEST_DATABASE_URL")
          app_name = database_name("DATABASE_URL")
          if test_name != app_name:
              raise SystemExit("Refusing CI: TEST_DATABASE_URL and DATABASE_URL differ.")

          engine = create_engine(os.environ["TEST_DATABASE_URL"], pool_pre_ping=True)
          try:
              with engine.connect() as connection:
                  current = connection.execute(text("SELECT current_database()")).scalar_one()
          finally:
              engine.dispose()

          if current != test_name or not current.endswith("_test"):
              raise SystemExit(f"Refusing CI: connected database {current!r} is not isolated.")
          print(f"Verified isolated CI database: {current}")
          PY

      - name: Run test suite
        run: pytest -q

      - name: Run Ruff
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check commit diff whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$PR_BASE_SHA" ]; then
              echo "Missing pull request base SHA" >&2
              exit 1
            fi
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA..$GITHUB_SHA"
          elif git cat-file -e "$GITHUB_SHA^" 2>/dev/null; then
            git diff --check "$GITHUB_SHA^..$GITHUB_SHA"
          else
            while read -r commit; do
              git diff-tree --check --root -r "$commit"
            done < <(git rev-list "$GITHUB_SHA")
          fi

      - name: Check dependency consistency
        run: pip check
